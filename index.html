<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stoop Events! Things to Do in Central Oregon</title>
<meta name="description" content="Upcoming events in Bend and Central Oregon, updated weekly.">
<meta name="theme-color" content="#fff8ec">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta property="og:title" content="Stoop Events!">
<meta property="og:description" content="Upcoming events in Bend and Central Oregon, updated weekly.">
<meta property="og:image" content="https://events.beansalad.org/logo.png">
<style>
  :root {
    --bg: #fff8ec; --card: #ffffff; --ink: #3a1c12; --muted: #7d5f50;
    --line: #f0dfc8; --accent: #c9432a; --teal: #1d8a86; --yellow: #f4bf2a;
    --chip: #fdecc8; --chip2: #dcf0ee; --hover: #fff1e8;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1f1612; --card: #2a1f1a; --ink: #f7eadb; --muted: #c6ab98;
      --line: #433027; --accent: #ff7b5c; --teal: #5cc8c2; --yellow: #f4bf2a;
      --chip: #43331f; --chip2: #1f3b39; --hover: #3a2a22; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    border-top: 5px solid; border-image: linear-gradient(90deg, var(--accent) 0 33%, var(--yellow) 33% 66%, var(--teal) 66%) 1; }
  header { padding: 18px 20px 10px; max-width: 920px; margin: 0 auto;
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .logo { display: block; height: 96px; width: auto; }
  @media (prefers-color-scheme: dark) { .logo { background: #fff8ec; border-radius: 14px; padding: 6px 10px; } }
  @media (max-width: 560px) { .logo { height: 72px; } header { gap: 6px; } }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .sub { color: var(--muted); font-size: .92rem; flex: 1 1 240px; }
  .sub b { color: var(--ink); font-weight: 600; }
  .filters { position: sticky; top: 0; z-index: 5; background: var(--bg);
    border-bottom: 1px solid var(--line); }
  .filters .inner { max-width: 920px; margin: 0 auto; padding: 10px 20px 12px;
    display: grid; gap: 8px; grid-template-columns: 1.6fr 1fr 1fr 1fr 1fr; }
  @media (max-width: 760px) { .filters .inner { grid-template-columns: 1fr 1fr; }
    .filters .search { grid-column: 1 / -1; } }
  .multi { position: relative; }
  .mbtn { width: 100%; padding: 9px 28px 9px 10px; font-size: .95rem; text-align: left; border-radius: 8px;
    overflow: hidden; text-overflow: ellipsis; position: relative; }
  .mbtn::after { content: ""; position: absolute; right: 11px; top: 50%; width: 6px; height: 6px; margin-top: -5px;
    border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(45deg); }
  .mbtn.active { border-color: var(--accent); background: var(--hover); color: var(--accent); font-weight: 600; }
  .panel { position: absolute; top: calc(100% + 4px); left: 0; z-index: 20; width: max(100%, 270px);
    max-width: calc(100vw - 24px); background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 8px 28px rgba(0,0,0,.14); padding: 8px; }
  .panel.right { left: auto; right: 0; }
  .panel .msearch { margin-bottom: 6px; padding: 7px 9px; font-size: .9rem; }
  .opts { max-height: 300px; overflow-y: auto; }
  .opt { display: flex; align-items: center; gap: 8px; padding: 6px 6px; border-radius: 6px; cursor: pointer; font-size: .92rem; }
  .opt:hover { background: var(--chip); }
  .opt[hidden], [hidden] { display: none !important; }
  .noopt { padding: 8px 6px; color: var(--muted); font-size: .88rem; }
  .opt input { width: auto; margin: 0; accent-color: var(--accent); }
  .opt .n { margin-left: auto; color: var(--muted); font-size: .8rem; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--card); }
  .seg button { border: 0; border-radius: 0; padding: 5px 10px; background: transparent; color: var(--muted); }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; font-weight: 600; }
  .share { margin-left: auto; padding: 2px 10px; font-size: .78rem; border-radius: 999px; color: var(--teal); font-weight: 600; }
  .share.hdr { margin-left: auto; padding: 6px 12px; font-size: .85rem; }
  .ev.hl { box-shadow: 0 0 0 3px var(--yellow); transition: box-shadow .3s; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
    background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 999px; font-size: .9rem; transition: all .2s; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  .tag.rec { background: transparent; border: 1px dashed var(--muted); color: var(--muted); }
  .mfoot { display: flex; justify-content: space-between; gap: 8px; padding-top: 8px; margin-top: 6px; border-top: 1px solid var(--line); }
  input, select { width: 100%; padding: 9px 10px; font: inherit; font-size: .95rem;
    color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
  .row2 { grid-column: 1 / -1; display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
    font-size: .9rem; color: var(--muted); }
  .row2 label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  .row2 input { width: auto; accent-color: var(--accent); }
  .row2 button { margin-left: auto; }
  main { max-width: 920px; margin: 0 auto; padding: 8px 20px 60px; }
  h2 { font-size: .92rem; margin: 24px 0 8px; color: var(--accent); font-weight: 700;
    text-transform: uppercase; letter-spacing: .05em; }
  .ev { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 8px; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; }
  .ev h3 { margin: 0; font-size: 1.02rem; }
  .ev h3 a { color: inherit; text-decoration: none; }
  .ev h3 a:hover { text-decoration: underline; }
  .meta { color: var(--muted); font-size: .9rem; grid-column: 1; }
  .tags { grid-column: 1; display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; align-items: center; }
  .tag { background: var(--chip); border-radius: 999px; padding: 2px 9px; font-size: .78rem; }
  .tag.cat { background: var(--chip2); }
  .ev { border-left: 4px solid var(--yellow); }
  .ev:hover { border-color: var(--line); border-left-color: var(--accent); }
  .ev h3 a:hover { color: var(--accent); }
  .cal { grid-column: 2; grid-row: 1 / span 3; display: flex; flex-direction: column; gap: 6px; align-self: center; }
  button, .btn { font: inherit; font-size: .82rem; padding: 6px 10px; border-radius: 7px; cursor: pointer;
    border: 1px solid var(--line); background: var(--card); color: var(--ink); text-decoration: none;
    white-space: nowrap; text-align: center; }
  .btn:hover, button:hover { border-color: var(--accent); background: var(--hover); }
  .cal .btn, .cal button { color: var(--teal); font-weight: 600; }
  input:focus, select:focus, button:focus-visible { outline: 2px solid var(--teal); outline-offset: 1px; }
  @media (max-width: 560px) { .ev { grid-template-columns: 1fr; }
    .cal { grid-column: 1; grid-row: auto; flex-direction: row; } }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  .save { padding: 2px 10px; font-size: .78rem; border-radius: 999px; color: var(--accent); font-weight: 600; }
  .save.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .ev.saved { border-left-color: var(--teal); }
  .hdrbtns { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .hdrbtns .share.hdr { margin-left: 0; }
  #savedBtn { padding: 6px 12px; font-size: .85rem; border-radius: 999px; font-weight: 600; color: var(--accent); }
  #savedBtn.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .count { display: inline-block; min-width: 1.4em; margin-left: 5px; padding: 0 5px; border-radius: 999px;
    background: var(--yellow); color: #3a1c12; font-size: .75rem; line-height: 1.4em; }
  .banner { max-width: 920px; margin: 10px auto 0; padding: 0 20px; }
  .banner > div { padding: 9px 13px; border-radius: 10px; background: var(--chip); border: 1px solid var(--yellow);
    font-size: .9rem; cursor: pointer; }
  .banner b { color: var(--accent); }
  .banner .warn { margin-top: 6px; background: var(--hover); border-color: var(--accent); }
  .stool { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 16px 0 6px; }
  .stool h2 { margin: 0 auto 0 0; }
  .sitem textarea { width: 100%; margin-top: 6px; padding: 6px 8px; font: inherit; font-size: .88rem; resize: vertical;
    color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 7px; }
  .sitem .opts2 { grid-column: 1; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: .85rem; color: var(--muted); margin-top: 4px; }
  .sitem select { width: auto; padding: 3px 6px; font-size: .85rem; }
  .flag { border-radius: 999px; padding: 2px 9px; font-size: .78rem; font-weight: 600; }
  .flag.moved { background: var(--yellow); color: #3a1c12; }
  .flag.gone { background: var(--accent); color: #fff; }
  .flag.soon { background: var(--teal); color: #fff; }
  .note2 { color: var(--muted); font-size: .85rem; margin: 6px 0 14px; }
  footer { color: var(--muted); font-size: .8rem; text-align: center; padding: 0 20px 40px; }
</style>
</head>
<body>
<header>
  <h1 class="vh">Stoop Events! Things to do in Central Oregon</h1>
  <picture><source srcset="logo.webp" type="image/webp"><img class="logo" src="logo.png" alt="Stoop Events!" width="1200" height="400"></picture>
  <div class="sub" id="status">Loading events…</div>
  <div class="hdrbtns">
    <button type="button" id="savedBtn" aria-pressed="false">&#9733; Saved<span class="count" id="scount" hidden></span></button>
    <button type="button" id="shareSite" class="share hdr">Share this page</button>
  </div>
</header>
<div class="banner" id="banner" hidden></div>

<div class="filters" id="filters"><div class="inner">
  <input class="search" id="q" type="search" placeholder="Search events, venues, towns" aria-label="Search">
  <select id="when" aria-label="Date range">
    <option value="all">Any date</option>
    <option value="today">Today</option>
    <option value="weekend">This weekend</option>
    <option value="7">Next 7 days</option>
    <option value="30">Next 30 days</option>
  </select>
  <div class="multi" id="m-group"></div>
  <div class="multi" id="m-town"></div>
  <div class="multi" id="m-venue"></div>
  <div class="row2">
    <label><input type="checkbox" id="free"> Free only</label>
    <div class="seg" role="radiogroup" aria-label="Recurring">
      <button type="button" data-rec="one" aria-pressed="true">One-off</button><button type="button" data-rec="all" aria-pressed="false">All</button><button type="button" data-rec="rec" aria-pressed="false">Recurring</button>
    </div>
    <span id="shown"></span>
    <button id="reset" type="button">Reset filters</button>
  </div>
</div></div>

<main id="list"></main>
<footer>Updated weekly. Event details come from public calendars; confirm times and tickets on each event's own page. Saved events and reminders are kept only in this browser.</footer>

<script>
const TZ = "America/Los_Angeles";
let EVENTS = [];
const $ = id => document.getElementById(id);

function todayISO() {
  return new Intl.DateTimeFormat("en-CA", { timeZone: TZ }).format(new Date());
}
function addDays(iso, n) {
  const d = new Date(iso + "T12:00:00Z"); d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}
function dow(iso) { return new Date(iso + "T12:00:00Z").getUTCDay(); }
function fmtDay(iso) {
  return new Date(iso + "T12:00:00Z").toLocaleDateString("en-US",
    { weekday: "long", month: "long", day: "numeric", timeZone: "UTC" });
}
function isFree(p) { return /^free\b/i.test(p || ""); }
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function safeUrl(u) { return /^https?:\/\//i.test(u || "") ? u : null; }

/* ---------- calendar helpers ---------- */
function compact(iso) { return iso.replace(/-/g, ""); }
function hm(t) { return t.replace(":", "") + "00"; }
function calTimes(e) {
  if (e.start) {
    const endDate = e.endsNextDay ? addDays(e.date, 1) : e.date;
    return { allDay: false, s: compact(e.date) + "T" + hm(e.start), e: compact(endDate) + "T" + hm(e.end) };
  }
  return { allDay: true, s: compact(e.date), e: compact(addDays(e.date, 1)) };
}
function details(e) {
  return [e.when, e.price ? "Price: " + e.price : "", e.link || ""].filter(Boolean).join("\n");
}
function place(e) { return [e.venue, e.town ? e.town + ", OR" : ""].filter(Boolean).join(", "); }

function googleUrl(e) {
  const t = calTimes(e);
  const p = new URLSearchParams({ action: "TEMPLATE", text: e.title,
    dates: t.s + "/" + t.e, details: details(e), location: place(e) });
  if (!t.allDay) p.set("ctz", TZ);
  return "https://calendar.google.com/calendar/render?" + p.toString();
}
function icsEsc(s) { return String(s).replace(/\\/g, "\\\\").replace(/\n/g, "\\n").replace(/[,;]/g, m => "\\" + m); }
function fold(line) {
  const out = []; while (line.length > 74) { out.push(line.slice(0, 74)); line = " " + line.slice(74); }
  out.push(line); return out.join("\r\n");
}
const VTZ = ["BEGIN:VTIMEZONE", "TZID:America/Los_Angeles",
  "BEGIN:DAYLIGHT", "TZOFFSETFROM:-0800", "TZOFFSETTO:-0700", "TZNAME:PDT",
  "DTSTART:19700308T020000", "RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=2SU", "END:DAYLIGHT",
  "BEGIN:STANDARD", "TZOFFSETFROM:-0700", "TZOFFSETTO:-0800", "TZNAME:PST",
  "DTSTART:19701101T020000", "RRULE:FREQ=YEARLY;BYMONTH=11;BYDAY=1SU", "END:STANDARD",
  "END:VTIMEZONE"];
function vevent(e, lead) {
  const t = calTimes(e);
  const stamp = new Date().toISOString().replace(/[-:]/g, "").slice(0, 15) + "Z";
  const uid = compact(e.date) + "-" + e.title.toLowerCase().replace(/[^a-z0-9]+/g, "-").slice(0, 40) + "@bendtodo";
  const lines = ["BEGIN:VEVENT", "UID:" + uid, "DTSTAMP:" + stamp];
  if (t.allDay) lines.push("DTSTART;VALUE=DATE:" + t.s, "DTEND;VALUE=DATE:" + t.e);
  else lines.push("DTSTART;TZID=" + TZ + ":" + t.s, "DTEND;TZID=" + TZ + ":" + t.e);
  lines.push("SUMMARY:" + icsEsc(e.title));
  if (place(e)) lines.push("LOCATION:" + icsEsc(place(e)));
  lines.push("DESCRIPTION:" + icsEsc(details(e)));
  if (safeUrl(e.link)) lines.push("URL:" + e.link);
  if (lead != null) lines.push("BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:" + icsEsc(e.title),
    "TRIGGER:" + (+lead > 0 ? "-P" + (+lead) + "D" : t.allDay ? "PT8H" : "-PT1H"), "END:VALARM");
  lines.push("END:VEVENT");
  return lines;
}
function icsFor(list, lead) {
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//bendtodo//EN", "CALSCALE:GREGORIAN", "METHOD:PUBLISH"];
  if (list.some(e => e.start)) lines.push(...VTZ);
  list.forEach(e => lines.push(...vevent(e, typeof lead === "function" ? lead(e) : lead)));
  lines.push("END:VCALENDAR");
  return lines.map(fold).join("\r\n") + "\r\n";
}
function saveFile(text, name) {
  const blob = new Blob([text], { type: "text/calendar;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function fileName(e) { return e.title.replace(/[^\w\- ]+/g, "").trim().slice(0, 60) + ".ics"; }
function downloadIcs(i) {
  const e = FILTERED[i], s = STORE.saved[evId(e)];
  saveFile(icsFor([e], s ? s.lead : null), fileName(e));
}

/* ---------- filtering and render ---------- */
let FILTERED = [];
function inRange(e, mode, today) {
  if (mode === "all") return true;
  if (mode === "today") return e.date === today;
  if (mode === "weekend") {
    const d = dow(today); // 0 Sun ... 6 Sat
    const start = d === 6 || d === 0 ? today : addDays(today, 5 - d);
    const end = d === 0 ? today : addDays(today, 7 - d);
    return e.date >= start && e.date <= end;
  }
  return e.date <= addDays(today, parseInt(mode, 10));
}
function render() {
  renderBanner();
  if (VIEW === "saved") { renderSaved(); return; }
  const today = todayISO();
  const q = $("q").value.trim().toLowerCase();
  const mode = $("when").value, free = $("free").checked, rec = REC;
  const pick = f => e => !SEL[f].size || SEL[f].has(e[f]);
  FILTERED = EVENTS.filter(e => e.date >= today && inRange(e, mode, today)
    && pick("group")(e) && pick("town")(e) && pick("venue")(e) && (!free || isFree(e.price))
    && (rec === "all" || (rec === "rec") === !!e._rec)
    && (!q || [e.title, e.venue, e.town, e.category].join(" ").toLowerCase().includes(q)));
  $("shown").textContent = FILTERED.length + " event" + (FILTERED.length === 1 ? "" : "s");
  const ongoing = REC === "one" ? "" : ongoingHtml(q, free);
  if (!FILTERED.length) { $("list").innerHTML = '<p class="empty">No events match these filters.</p>' + ongoing; return; }
  let html = "", last = "";
  FILTERED.forEach((e, i) => {
    if (e.date !== last) { html += "<h2>" + esc(fmtDay(e.date)) + "</h2>"; last = e.date; }
    const link = safeUrl(e.link);
    const title = link ? '<a href="' + esc(link) + '" target="_blank" rel="noopener">' + esc(e.title) + "</a>" : esc(e.title);
    const meta = [e.when, e.venue, e.town].filter(Boolean).map(esc).join(" · ");
    const sv = !!STORE.saved[evId(e)];
    html += '<article class="ev' + (sv ? " saved" : "") + '" id="ev-' + esc(evId(e)) + '"><h3>' + title + '</h3><div class="meta">' + meta + "</div>"
      + '<div class="tags">' + (e.price ? '<span class="tag">' + esc(e.price) + "</span>" : "")
      + (e.category ? '<span class="tag cat">' + esc(e.category) + "</span>" : "")
      + (e._rec ? '<span class="tag rec">Recurring</span>' : "")
      + '<button type="button" class="share" data-share="' + i + '" aria-label="Share ' + esc(e.title) + '">Share</button>'
      + '<button type="button" class="save' + (sv ? " on" : "") + '" data-save="' + i + '" aria-pressed="' + sv + '" title="Save and get a reminder">'
      + (sv ? "&#9733; Saved" : "&#9734; Save") + "</button></div>"
      + '<div class="cal"><a class="btn" href="' + esc(googleUrl(e)) + '" target="_blank" rel="noopener">+ Google / Android</a>'
      + '<button type="button" data-ics="' + i + '">+ Apple / iCal</button></div></article>';
  });
  $("list").innerHTML = html + ongoing;
}
function ongoingHtml(q, free) {
  const pick = f => o => !SEL[f].size || SEL[f].has(o[f]);
  const list = ONGOING.filter(o => pick("group")(o) && pick("town")(o) && pick("venue")(o) && (!free || isFree(o.price))
    && (!q || [o.title, o.venue, o.town, o.category].join(" ").toLowerCase().includes(q)));
  if (!list.length) return "";
  return "<h2>Ongoing, check schedule</h2>" + list.map(o => {
    const link = safeUrl(o.link);
    const title = link ? '<a href="' + esc(link) + '" target="_blank" rel="noopener">' + esc(o.title) + "</a>" : esc(o.title);
    return '<article class="ev"><h3>' + title + '</h3><div class="meta">' + [o.when, o.venue, o.town].filter(Boolean).map(esc).join(" · ")
      + '</div><div class="tags">' + (o.price ? '<span class="tag">' + esc(o.price) + "</span>" : "")
      + (o.category ? '<span class="tag cat">' + esc(o.category) + "</span>" : "") + '<span class="tag rec">Recurring</span></div></article>';
  }).join("");
}
/* ---------- recurring detection ---------- */
let REC = "one", ONGOING = [];
const REC_WHEN = /\b(first|second|third|fourth|last)\s+(mon|tue|wed|thu|fri|sat|sun)|\b(mondays|tuesdays|wednesdays|thursdays|fridays|saturdays|sundays|weekly|monthly|daily|every)\b/i;
function markRecurring(list) {
  const norm = t => (t || "").toLowerCase().replace(/\(.*?\)/g, "").replace(/[^a-z0-9]+/g, " ").trim();
  const dates = {}, add = (k, d) => { (dates[k] = dates[k] || new Set()).add(d); };
  list.forEach(e => {
    add("t|" + norm(e.title), e.date);
    add("tv|" + norm(e.title) + "|" + norm(e.venue), e.date);
    if (e.link && !/\/whats-on\/events\/?$/.test(e.link)) add("l|" + e.link, e.date);
  });
  list.forEach(e => {
    const t = norm(e.title);
    if (typeof e.recurring === "boolean") { e._rec = e.recurring; return; }
    e._rec = REC_WHEN.test(e.when || "")
      || dates["t|" + t].size >= 3
      || dates["tv|" + t + "|" + norm(e.venue)].size >= 2
      || (e.link && dates["l|" + e.link] && dates["l|" + e.link].size >= 2);
  });
}
function setRec(v) {
  REC = v;
  document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.rec === v)));
}
document.querySelector(".seg").addEventListener("click", ev => {
  const b = ev.target.closest("[data-rec]"); if (!b) return;
  setRec(b.dataset.rec); render();
});

/* ---------- share ---------- */
function evId(e) {
  return e.date + "-" + e.title.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 50);
}
function toast(msg) {
  let t = document.getElementById("toast");
  if (!t) { t = document.createElement("div"); t.id = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
  t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2200);
}
async function share(title, text, url) {
  if (navigator.share) {
    try { await navigator.share({ title, text, url }); return; } catch (err) { if (err && err.name === "AbortError") return; }
  }
  try { await navigator.clipboard.writeText(url); toast("Link copied"); }
  catch { prompt("Copy this link:", url); }
}
function pageUrl() { return location.origin + location.pathname; }
function shareEvent(i) {
  const e = FILTERED[i];
  share(e.title, e.title + ", " + fmtDay(e.date) + (e.when ? " (" + e.when + ")" : "") + (e.venue ? " at " + e.venue : ""),
    pageUrl() + "#" + evId(e));
}
function openFromHash() {
  if (location.hash.startsWith("#saved=")) { importSaved(location.hash.slice(7)); return; }
  const id = decodeURIComponent(location.hash.slice(1)); if (!id) return;
  if (VIEW === "saved") setView("all");
  const e = EVENTS.find(x => evId(x) === id); if (!e) return;
  setRec(e._rec ? "all" : REC); render();
  const el = document.getElementById("ev-" + id);
  if (el) { el.scrollIntoView({ block: "center" }); el.classList.add("hl"); setTimeout(() => el.classList.remove("hl"), 2600); }
}
window.addEventListener("hashchange", openFromHash);
$("shareSite").addEventListener("click", () => share("Stoop Events!", "Things to do in Bend and Central Oregon", pageUrl()));

/* ---------- saved events and reminders (this browser only) ---------- */
const SKEY = "stoop.v1";
const STORE = (() => { let s; try { s = JSON.parse(localStorage.getItem(SKEY)) || {}; } catch (e) { s = {}; }
  s.saved = s.saved || {}; return s; })();
function persist() { try { localStorage.setItem(SKEY, JSON.stringify(STORE)); } catch (e) {} updateCount(); }
let VIEW = "all";
const LEADS = [[0, "the same day"], [1, "1 day before"], [3, "3 days before"], [7, "1 week before"]];
const normT = t => (t || "").toLowerCase().replace(/\(.*?\)/g, "").replace(/[^a-z0-9]+/g, " ").trim();
function snap(e, old) {
  return { id: evId(e), title: e.title, date: e.date, when: e.when || "", start: e.start, end: e.end, endsNextDay: e.endsNextDay,
    venue: e.venue || "", town: e.town || "", price: e.price || "", link: e.link || "",
    lead: old ? old.lead : 1, note: old ? old.note : "", at: old ? old.at : todayISO(), movedFrom: old ? old.movedFrom : undefined };
}
function daysUntil(iso) { return Math.round((Date.parse(iso + "T12:00:00Z") - Date.parse(todayISO() + "T12:00:00Z")) / 864e5); }
function rel(iso) { const n = daysUntil(iso); return n === 0 ? "today" : n === 1 ? "tomorrow" : n < 0 ? -n + " days ago" : n < 7 ? "in " + n + " days" : "in " + Math.round(n / 7) + " wk"; }
function shortDay(iso) { return new Date(iso + "T12:00:00Z").toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", timeZone: "UTC" }); }
/* Match each saved event to this week's list. Same id = unchanged. Otherwise look for a single upcoming event
   with the same link or title+venue: that is a move. Nothing found and not yet past = no longer listed. */
let SAVED = [];
function resolveSaved() {
  const today = todayISO(), byId = {};
  EVENTS.forEach(e => { byId[evId(e)] = e; });
  let changed = false;
  SAVED = Object.keys(STORE.saved).map(k => {
    const s = STORE.saved[k];
    let e = byId[s.id], status = "ok";
    if (!e) {
      const generic = !s.link || /\/whats-on\/events\/?$/.test(s.link);
      const cands = EVENTS.filter(x => x.date >= today && ((!generic && x.link === s.link && normT(x.title) === normT(s.title))
        || (normT(x.title) === normT(s.title) && normT(x.venue) === normT(s.venue))));
      if (cands.length === 1) {
        e = cands[0]; status = "moved";
        const from = shortDay(s.date) + (s.when ? " (" + s.when + ")" : "");
        STORE.saved[k] = Object.assign(snap(e, s), { movedFrom: s.movedFrom || from });
        changed = true;
      } else status = s.date < today ? "past" : "gone";
    }
    const cur = STORE.saved[k];
    if (e && status === "ok" && (cur.when !== (e.when || "") || cur.price !== (e.price || ""))) {
      STORE.saved[k] = snap(e, cur); changed = true;
    }
    if (STORE.saved[k].movedFrom && status === "ok") status = "moved";
    return { key: k, s: STORE.saved[k], e, status };
  }).sort((a, b) => (a.s.date + (a.s.start || "99")).localeCompare(b.s.date + (b.s.start || "99")));
  if (changed) persist(); else updateCount();
}
function toggleSave(e) {
  const id = evId(e);
  if (STORE.saved[id]) { delete STORE.saved[id]; toast("Removed from saved"); }
  else { STORE.saved[id] = snap(e); toast("Saved. You'll get a reminder here the day before."); }
  persist(); resolveSaved(); render();
}
function updateCount() {
  const n = SAVED.filter(o => o.status !== "past").length, c = $("scount");
  c.hidden = !n; c.textContent = n;
}
function renderBanner() {
  const soon = [], warn = [];
  SAVED.forEach(o => {
    const d = daysUntil(o.s.date);
    if ((o.status === "ok" || o.status === "moved") && d >= 0 && d <= Math.max(1, +o.s.lead))
      soon.push("<b>" + esc(o.s.title) + "</b> " + rel(o.s.date) + (o.s.when ? ", " + esc(o.s.when) : ""));
    if (o.status === "moved") warn.push("<b>" + esc(o.s.title) + "</b> moved to " + esc(shortDay(o.s.date)) + (o.s.when ? " (" + esc(o.s.when) + ")" : ""));
    if (o.status === "gone") warn.push("<b>" + esc(o.s.title) + "</b> (" + esc(shortDay(o.s.date)) + ") is no longer listed. It may be cancelled.");
  });
  const b = $("banner");
  b.innerHTML = (soon.length ? "<div>&#9200; " + soon.join(" &middot; ") + "</div>" : "")
    + (warn.length ? '<div class="warn">&#9888; ' + warn.join(" &middot; ") + "</div>" : "");
  b.hidden = !soon.length && !warn.length;
}
function setView(v) {
  VIEW = v;
  $("savedBtn").classList.toggle("on", v === "saved");
  $("savedBtn").setAttribute("aria-pressed", String(v === "saved"));
  $("filters").hidden = v === "saved";
}
function renderSaved() {
  const up = SAVED.filter(o => o.status !== "past"), past = SAVED.length - up.length;
  let h = '<div class="stool"><h2>Your saved events</h2>'
    + '<button type="button" id="sAll">All to calendar</button>'
    + '<button type="button" id="sShare">Share my list</button>'
    + '<button type="button" id="sBack">&larr; All events</button></div>';
  if (!up.length) h += '<p class="empty">Nothing saved yet. Tap &#9734; Save on any event. Saved events get a reminder banner here before they happen, and a notice if they move or drop off the calendar.</p>';
  up.forEach(o => {
    const s = o.s, link = safeUrl(s.link);
    const title = link ? '<a href="' + esc(link) + '" target="_blank" rel="noopener">' + esc(s.title) + "</a>" : esc(s.title);
    const flag = o.status === "moved" ? '<span class="flag moved">Moved from ' + esc(s.movedFrom) + "</span>"
      + ' <button type="button" class="save" data-ack="' + esc(o.key) + '">OK</button>'
      : o.status === "gone" ? '<span class="flag gone">No longer listed, may be cancelled</span>'
      : "";
    h += '<article class="ev saved sitem"><h3>' + title + '</h3><div class="meta">'
      + [shortDay(s.date) + " (" + rel(s.date) + ")", s.when, s.venue, s.town].filter(Boolean).map(esc).join(" &middot; ") + "</div>"
      + '<div class="tags">' + (s.price ? '<span class="tag">' + esc(s.price) + "</span>" : "") + flag + "</div>"
      + '<div class="opts2">Remind me <select data-lead="' + esc(o.key) + '">'
      + LEADS.map(([n, l]) => '<option value="' + n + '"' + (+s.lead === n ? " selected" : "") + ">" + l + "</option>").join("")
      + '</select><button type="button" class="share" style="margin-left:0" data-unsave="' + esc(o.key) + '">Remove</button></div>'
      + '<div style="grid-column:1"><textarea rows="1" data-note="' + esc(o.key) + '" placeholder="Note (who is going, tickets...)">' + esc(s.note || "") + "</textarea></div>"
      + (o.status === "gone" ? "" : '<div class="cal"><a class="btn" href="' + esc(googleUrl(s)) + '" target="_blank" rel="noopener">+ Google / Android</a>'
      + '<button type="button" data-sics="' + esc(o.key) + '">+ Apple / iCal</button></div>') + "</article>";
  });
  if (past) h += '<p class="note2">' + past + " past saved event" + (past > 1 ? "s" : "") + ' hidden. <button type="button" id="sClear">Clear</button></p>';
  $("list").innerHTML = h;
  $("sAll").disabled = !up.some(o => o.status !== "gone");
  $("sShare").disabled = !up.length;
}
$("savedBtn").addEventListener("click", () => { setView(VIEW === "saved" ? "all" : "saved"); render(); scrollTo(0, 0); });
$("banner").addEventListener("click", () => { if (VIEW !== "saved") { setView("saved"); render(); scrollTo(0, 0); } });
$("list").addEventListener("click", ev => {
  if (VIEW !== "saved") return;
  const t = ev.target;
  if (t.closest("#sBack")) { setView("all"); render(); return; }
  if (t.closest("#sAll")) { const l = SAVED.filter(o => o.status === "ok" || o.status === "moved");
    saveFile(icsFor(l.map(o => o.s), e => STORE.saved[e.id] ? STORE.saved[e.id].lead : 1), "stoop-saved-events.ics"); return; }
  if (t.closest("#sShare")) { shareSaved(); return; }
  if (t.closest("#sClear")) { SAVED.filter(o => o.status === "past").forEach(o => delete STORE.saved[o.key]); persist(); resolveSaved(); render(); return; }
  const u = t.closest("[data-unsave]"); if (u) { delete STORE.saved[u.dataset.unsave]; persist(); resolveSaved(); render(); return; }
  const a = t.closest("[data-ack]"); if (a) { delete STORE.saved[a.dataset.ack].movedFrom; persist(); resolveSaved(); render(); return; }
  const i = t.closest("[data-sics]"); if (i) { const s = STORE.saved[i.dataset.sics]; saveFile(icsFor([s], s.lead), fileName(s)); }
});
$("list").addEventListener("change", ev => {
  const l = ev.target.closest("[data-lead]"); if (!l) return;
  STORE.saved[l.dataset.lead].lead = +l.value; persist(); renderBanner();
});
$("list").addEventListener("input", ev => {
  const n = ev.target.closest("[data-note]"); if (!n) return;
  STORE.saved[n.dataset.note].note = n.value; persist();
});
function shareSaved() {
  const up = SAVED.filter(o => o.status === "ok" || o.status === "moved");
  const url = pageUrl() + "#saved=" + encodeURIComponent(JSON.stringify(up.map(o => o.s.id)));
  const text = "My saved events:\n" + up.map(o => "- " + o.s.title + ", " + shortDay(o.s.date) + (o.s.when ? " (" + o.s.when + ")" : "")).join("\n");
  share("My Stoop Events list", text, url);
}
function importSaved(raw) {
  let ids = []; try { ids = JSON.parse(decodeURIComponent(raw)); } catch (e) {}
  history.replaceState(null, "", location.pathname + location.search);
  const found = (Array.isArray(ids) ? ids : []).map(id => EVENTS.find(e => evId(e) === id)).filter(Boolean).filter(e => !STORE.saved[evId(e)]);
  if (!found.length) { toast("Those events are already saved or no longer listed"); return; }
  if (!confirm("A friend shared these events:\n\n" + found.map(e => e.title + ", " + shortDay(e.date)).join("\n") + "\n\nSave them in this browser?")) return;
  found.forEach(e => { STORE.saved[evId(e)] = Object.assign(snap(e), { note: "Shared by a friend" }); });
  persist(); resolveSaved(); setView("saved"); render();
}

/* ---------- multi-select filters ---------- */
const SEL = { group: new Set(), town: new Set(), venue: new Set() };
const LABELS = { group: ["All categories", "categories"], town: ["All towns", "towns"], venue: ["All venues", "venues"] };

function setLabel(f) {
  const b = $("m-" + f).querySelector(".mbtn"), s = SEL[f];
  b.textContent = !s.size ? LABELS[f][0] : s.size === 1 ? [...s][0] : s.size + " " + LABELS[f][1];
  b.classList.toggle("active", s.size > 0);
  b.title = [...s].join(", ");
}
function closeAll(except) {
  document.querySelectorAll(".multi").forEach(m => {
    if (m === except) return;
    m.querySelector(".panel").hidden = true;
    m.querySelector(".mbtn").setAttribute("aria-expanded", "false");
  });
}
function buildMulti(f, searchable) {
  const root = $("m-" + f), today = todayISO();
  const counts = {};
  EVENTS.forEach(e => { if (e[f] && e.date >= today) counts[e[f]] = (counts[e[f]] || 0) + 1; });
  const values = Object.keys(counts).sort((a, b) => a.localeCompare(b));
  root.innerHTML = '<button type="button" class="mbtn" aria-haspopup="listbox" aria-expanded="false"></button>'
    + '<div class="panel" hidden>'
    + (searchable ? '<input type="search" class="msearch" placeholder="Find a ' + LABELS[f][1].slice(0, -1) + '" aria-label="Find">' : "")
    + '<div class="opts" role="listbox" aria-multiselectable="true">'
    + values.map(v => '<label class="opt"><input type="checkbox" value="' + esc(v) + '"><span>' + esc(v)
      + '</span><span class="n">' + counts[v] + "</span></label>").join("")
    + '</div><div class="mfoot"><button type="button" class="mclear">Clear</button>'
    + '<button type="button" class="mdone">Done</button></div></div>';
  const btn = root.querySelector(".mbtn"), panel = root.querySelector(".panel");
  btn.addEventListener("click", () => {
    const open = panel.hidden; closeAll(root); panel.hidden = !open;
    btn.setAttribute("aria-expanded", String(open));
    if (open) {
      panel.classList.remove("right");
      if (panel.getBoundingClientRect().right > window.innerWidth - 8) panel.classList.add("right");
      panel.querySelector(".opts").scrollTop = 0;
      const s = panel.querySelector(".msearch");
      if (s) { s.value = ""; panel.querySelectorAll(".opt").forEach(o => o.hidden = false); s.focus(); }
    }
  });
  panel.addEventListener("change", ev => {
    const cb = ev.target; if (!cb.matches('input[type="checkbox"]')) return;
    cb.checked ? SEL[f].add(cb.value) : SEL[f].delete(cb.value);
    setLabel(f); render();
  });
  const search = panel.querySelector(".msearch");
  if (search) search.addEventListener("input", () => {
    const t = search.value.trim().toLowerCase();
    let shown = 0;
    panel.querySelectorAll(".opt").forEach(o => {
      const hit = !t || o.querySelector("span").textContent.toLowerCase().includes(t);
      o.hidden = !hit; if (hit) shown++;
    });
    let none = panel.querySelector(".noopt");
    if (!shown && !none) { none = document.createElement("div"); none.className = "noopt"; none.textContent = "No matches";
      panel.querySelector(".opts").appendChild(none); }
    if (none) none.hidden = shown > 0;
  });
  panel.querySelector(".mclear").addEventListener("click", () => {
    SEL[f].clear(); panel.querySelectorAll("input[type=checkbox]").forEach(c => c.checked = false);
    setLabel(f); render();
  });
  panel.querySelector(".mdone").addEventListener("click", () => { closeAll(); btn.focus(); });
  setLabel(f);
}
document.addEventListener("click", ev => { if (!ev.target.closest(".multi")) closeAll(); });
document.addEventListener("keydown", ev => { if (ev.key === "Escape") closeAll(); });

$("list").addEventListener("click", ev => {
  const b = ev.target.closest("[data-ics]"); if (b) downloadIcs(+b.dataset.ics);
  const s = ev.target.closest("[data-share]"); if (s) shareEvent(+s.dataset.share);
  const v = ev.target.closest("[data-save]"); if (v) toggleSave(FILTERED[+v.dataset.save]);
});
["q", "when", "free"].forEach(id => $(id).addEventListener("input", render));
$("reset").addEventListener("click", () => {
  $("q").value = ""; $("when").value = "all"; $("free").checked = false;
  setRec("one");
  Object.keys(SEL).forEach(f => {
    SEL[f].clear(); $("m-" + f).querySelectorAll("input[type=checkbox]").forEach(c => c.checked = false); setLabel(f);
  });
  render();
});

fetch("events.json", { cache: "no-cache" }).then(r => r.json()).then(data => {
  EVENTS = data.events || [];
  ONGOING = data.ongoing || [];
  markRecurring(EVENTS);
  buildMulti("group", false);
  buildMulti("town", true);
  buildMulti("venue", true);
  const upd = data.updated ? new Date(data.updated).toLocaleDateString("en-US",
    { month: "long", day: "numeric", year: "numeric", timeZone: TZ }) : "";
  $("status").textContent = "Things to do in Bend, Sisters, Redmond and around. " + (upd ? "Updated " + upd + "." : "");
  resolveSaved();
  render();
  openFromHash();
}).catch(() => { $("status").textContent = "Could not load events."; });
</script>
</body>
